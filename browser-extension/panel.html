<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>证链 · 随手核验</title><link rel="stylesheet" href="panel.css"><script type="module" src="panel.js"></script></head>
<body><header><a class="brand" href="https://api.linsixuan.cn/" target="_blank" rel="noreferrer"><span class="mark" aria-hidden="true">◎</span><span>证链<small>EVIDENCE MESH</small></span></a><span class="pill">随手核验</span></header>
<main><section class="intro"><p class="eyebrow">FOLLOW THE EVIDENCE</p><h1>刷到一条消息，<br>顺手核一下。</h1><p>从一句具体说法出发，看看依据在哪里。</p></section>
<section class="context"><div class="section-label"><span>正在浏览</span><button id="capture" type="button">重新读取 ↻</button></div><p id="page-title">选中网页文字，再点击证链图标。</p><a id="page-url" hidden target="_blank" rel="noreferrer"></a><p id="context-hint" class="muted">只读取你主动选择的文字、标题和链接，不自动读取视频或字幕。</p><button id="use-selection" class="text-button" hidden>将选中文字填入下方</button></section>
<form id="check-form"><label for="claim">你想核验哪句话？</label><textarea id="claim" maxlength="6000" rows="5" placeholder="例如：视频中说，这项新政策适用于全国所有学校。" required></textarea><div class="input-meta"><span>可选；默认自动提取核心主张</span><span id="count">0 / 6000</span></div><label class="confirm"><input id="confirm" type="checkbox" required><span>我已确认这就是需要核验的主张</span></label><button id="submit" class="primary" type="submit"><span>核验这条消息</span><span aria-hidden="true">↗</span></button><p class="footnote">也可手动补充需要核验的具体说法。</p></form>
<p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
<section id="result" class="result" hidden aria-live="polite"><div class="section-label"><span id="result-kind">核验结果</span><span id="result-time"></span></div><p id="checked-claim" class="checked-claim"></p><h2 id="verdict"></h2><p id="conclusion" class="conclusion"></p><div id="claim-results"></div><p id="scope" class="footnote"></p><details id="sources-box"><summary>查看依据与来源 <span id="source-count"></span></summary><div id="sources"></div><ul id="gaps"></ul></details><details><summary>协作记录</summary><div id="trace"></div></details><button id="refresh" class="text-button" type="button">查询任务状态</button></section>
<details id="settings" class="settings"><summary>访问设置 <span id="credential-state">未配置</span></summary><p class="muted">首次使用，导入独立的插件访问文件。凭证仅保存在本次浏览器会话，不随浏览器同步。</p><label for="credential-file" class="file-label">导入插件访问文件<input id="credential-file" type="file" accept=".txt,text/plain"></label><label for="credential">或填写插件访问凭证</label><input id="credential" type="password" autocomplete="off" spellcheck="false" placeholder="独立凭证，不是网站测试口令"><div class="settings-actions"><button id="save-credential" class="secondary" type="button">保存到本次会话</button><button id="forget" class="text-button" type="button">忘记凭证</button></div></details>
<footer><span>证链 · 浏览器插件 0.3.3</span><a href="https://api.linsixuan.cn/" target="_blank" rel="noreferrer">打开网站 ↗</a></footer></main>
</body></html>
