[SERVICE]
    Flush        2
    Log_Level    info
    Parsers_File /fluent-bit/etc/amp-parsers.conf

[INPUT]
    Name             tail
    Path             /var/log/acps/*/amp_heartbeat_*.jsonl
    Tag              amp.heartbeat
    Parser           amp_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /var/lib/fluent-bit/heartbeat.db

[INPUT]
    Name             tail
    Path             /var/log/acps/*/amp_access_*.jsonl
    Tag              amp.access
    Parser           amp_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /var/lib/fluent-bit/access.db

[INPUT]
    Name             tail
    Path             /var/log/acps/*/amp_audit_*.jsonl
    Tag              amp.audit
    Parser           amp_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /var/lib/fluent-bit/audit.db

[INPUT]
    Name             tail
    Path             /var/log/acps/*/amp_message_*.jsonl
    Tag              amp.message
    Parser           amp_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /var/lib/fluent-bit/message.db

[OUTPUT]
    Name                              kafka
    Match                             amp.heartbeat
    Brokers                           ${AMP_KAFKA_BROKERS}
    Topics                            amp.heartbeat
    Format                            json
    Workers                           1
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false

[OUTPUT]
    Name                              kafka
    Match                             amp.access
    Brokers                           ${AMP_KAFKA_BROKERS}
    Topics                            amp.access
    Format                            json
    Workers                           1
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false

[OUTPUT]
    Name                              kafka
    Match                             amp.audit
    Brokers                           ${AMP_KAFKA_BROKERS}
    Topics                            amp.audit
    Format                            json
    Workers                           1
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false

[OUTPUT]
    Name                              kafka
    Match                             amp.message
    Brokers                           ${AMP_KAFKA_BROKERS}
    Topics                            amp.message
    Format                            json
    Workers                           1
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false
