services:
  source-verifier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - evidence_mesh.source_partner:app
      - --host
      - 0.0.0.0
      - --port
      - "8021"
    environment:
      AIP_IDENTITY_BINDING_ENABLED: "false"
    ports:
      - "127.0.0.1:8021:8021"
    restart: unless-stopped

  evidence-grader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - evidence_mesh.grader_partner:app
      - --host
      - 0.0.0.0
      - --port
      - "8022"
    environment:
      AIP_IDENTITY_BINDING_ENABLED: "false"
    ports:
      - "127.0.0.1:8022:8022"
    restart: unless-stopped

  contradiction-scout:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - python
      - -m
      - uvicorn
      - evidence_mesh.contradiction_partner:app
      - --host
      - 0.0.0.0
      - --port
      - "8023"
    environment:
      AIP_IDENTITY_BINDING_ENABLED: "false"
    ports:
      - "127.0.0.1:8023:8023"
    restart: unless-stopped

  leader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AIP_IDENTITY_BINDING_ENABLED: "false"
      SOURCE_VERIFIER_URL: http://source-verifier:8021/rpc
      EVIDENCE_GRADER_URL: http://evidence-grader:8022/rpc
      CONTRADICTION_SCOUT_URL: http://contradiction-scout:8023/rpc
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - source-verifier
      - evidence-grader
      - contradiction-scout
    restart: unless-stopped
