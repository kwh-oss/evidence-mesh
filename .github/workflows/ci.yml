name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install official AIP SDK from pinned source
        run: >-
          python -m pip install
          "https://github.com/AIP-PUB/ACPs-community/archive/refs/tags/v2.2.0.zip#subdirectory=acps-sdk"

      - name: Run public-repository safety check
        run: python scripts/check_public_repo.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate ACS drafts
        run: python scripts/validate_acs_drafts.py
