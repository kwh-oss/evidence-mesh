name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install public engineering dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run public-repository safety check
        run: python scripts/check_public_repo.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate ACS drafts
        run: python scripts/validate_acs_drafts.py

      - name: Check browser extension model
        run: node --test browser-extension/model.test.mjs

      - name: Check original-task recovery UI
        run: node tests/web_recovery_ui_test.cjs

      - name: Run local four-service AIP flow
        run: python scripts/local_demo.py --smoke
